name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  web:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Build tanpa environment variables rahasia: halaman dirender per
      # permintaan dan tidak membutuhkan Supabase saat build.
      - run: npm run build

  database:
    name: Migrasi, RLS, dan alur langganan (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pastikan binari PostgreSQL tersedia
        run: |
          if ! ls /usr/lib/postgresql/*/bin/pg_ctl >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql
          fi
      - run: npm run test:db
